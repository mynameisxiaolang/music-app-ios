name: YueYin
options:
  bundleIdPrefix: com.yueyin
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # 最新 XcodeGen 默认生成 Xcode 16 工程格式(77),macos-14 runner 的 Xcode 15.4 读不了 —— 固定为 15 格式
  xcodeVersion: "15.0"
packages:
  YueYinCore:
    path: Core
targets:
  YueYin:
    type: application
    platform: iOS
    sources: [YueYin]
    dependencies:
      - package: YueYinCore
    info:
      path: YueYin/Info.plist
      properties:
        CFBundleDisplayName: 悦音音乐
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yueyin.music
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
  YueYinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YueYinTests]
    dependencies:
      - target: YueYin
      - package: YueYinCore
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  YueYin:
    build:
      targets:
        YueYin: all
    run:
      config: Debug
    test:
      targets:
        - YueYinTests
